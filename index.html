<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VREEL Desk AR Preview</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f2;color:#172033;display:grid;min-height:100vh;place-items:center}
main{width:min(520px,calc(100% - 32px));text-align:center}
h1{font-size:28px;margin:0 0 10px}p{line-height:1.5;color:#596273}
button{border:0;border-radius:12px;background:#172033;color:white;padding:16px 24px;font-size:17px;font-weight:700;cursor:pointer;width:100%}
small{display:block;margin-top:14px;color:#7b8390}.status{margin-top:14px;min-height:24px}
</style>
</head>
<body>
<main>
<h1>VREEL Desk AR Preview</h1>
<p>Android / ARCore test. The model is placed using its GLB physical scale and resizing is disabled.</p>
<button id="ar">AR ile odanızda görüntüleyin</button>
<div class="status" id="status"></div>
<small>Preview environment — not production.</small>
</main>
<script>
const button=document.querySelector('#ar'),status=document.querySelector('#status');
button.addEventListener('click',()=>{
 const file=new URL('./Desk.glb',location.href).href;
 if(!/Android/i.test(navigator.userAgent)){
   status.textContent='Bu pilot şu anda Android / ARCore cihazlarda test ediliyor.';
   return;
 }
 const q=new URLSearchParams({file,mode:'ar_preferred',title:'VREEL Desk AR Preview',resizable:'false'});
 const fallback=encodeURIComponent(location.href);
 location.href='intent://arvr.google.com/scene-viewer/1.1?'+q.toString()+'#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url='+fallback+';end;';
});
</script>
</body>
</html>
